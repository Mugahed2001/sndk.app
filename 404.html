<body>
<!-- مسارات جذرية لا نسبية عمداً: هذه الصفحة وحدها تُخدَّم عند أي عمق مسار
     (‎/facility/<uuid>‎، ‎/appointment/<uuid>‎...)، فمسارٌ نسبي كـ«js/routing.js»
     يُحلّ نسبةً إلى شريط العنوان الحالي لا إلى جذر الموقع الفعلي — فيصير
     «/facility/js/routing.js» بدل «/js/routing.js» ويفشل 404. باقي صفحات
     الموقع تُخدَّم دائماً من عمقٍ ثابت معروف فتبقى مساراتها نسبية بأمان. -->
<script src="/js/routing.js?v=20"></script>
<script src="/js/404-redirect.js?v=20"></script>
</body>
