<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>تجربة مساعد سندك المحلي</title>
  <script src="js/config.js"></script>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;line-height:1.6}
    h1{font-size:1.2rem}
    textarea{width:100%;height:4.5rem;font:inherit;padding:.6rem;border:1px solid #bbb;border-radius:8px}
    button{font:inherit;padding:.5rem 1rem;border:0;border-radius:8px;background:#0b7285;color:#fff;cursor:pointer}
    #meta{font-family:ui-monospace,monospace;font-size:.8rem;color:#555;margin:.5rem 0}
    #out{white-space:normal;background:#f4f4f5;padding:1rem;border-radius:8px;min-height:8rem}
    #out table{border-collapse:collapse;width:100%}
    #out th,#out td{border:1px solid #ccc;padding:4px 7px;text-align:start}
    #out a{color:#0b7285}
    .chips button{background:#e7f5f8;color:#0b7285;margin:.15rem;font-size:.85rem}
    small{color:#777}
  </style>
</head>
<body>
  <h1>تجربة المساعد المحلي — <span id="mode">…</span></h1>
  <p><small>صفحة اختبار داخلية (noindex). النموذج يُنزَّل من HuggingFace عند أول سؤال (~50MB، يُخزَّن مؤقتاً).</small></p>

  <div class="chips">
    <button data-q="كيف الطقس اليوم في صنعاء">خارج النطاق</button>
    <button data-q="السلام عليكم وش تقدر تسوي">تحية</button>
    <button data-q="كيف احجز موعد">إرشاد الحجز</button>
    <button data-q="أبغى دكتور رمد في صنعاء">بحث + مدينة</button>
    <button data-q="مستشفيات في عدن">بحث مرافق</button>
    <button data-q="من الأطباء في مستشفى الثورة؟">جدول عيادة (خطوتان)</button>
    <button data-q="التخصصات المتاحة">قائمة تخصّصات</button>
    <button data-q="والدكتور الثاني">متابعة (بعد نتيجة)</button>
  </div>

  <p><textarea id="q" placeholder="اكتب سؤالك…"></textarea></p>
  <p><button id="go">اسأل</button> <button id="warm" style="background:#666">تهيئة النموذج</button></p>
  <div id="meta"></div>
  <div id="out">—</div>

  <script type="module">
    import { createLocalAssistant } from './js/ai/client/assistant-local.mjs';
    import { renderMarkdown } from './js/ai/markdown.mjs';

    const c = window.SNDK_CONFIG || {};
    document.getElementById('mode').textContent = c.SUPABASE_URL ? 'جاهز' : 'SNDK_CONFIG ناقص';

    const anon = localStorage.getItem('sndk_anon_id')
      || (localStorage.setItem('sndk_anon_id', crypto.randomUUID()), localStorage.getItem('sndk_anon_id'));

    const bot = createLocalAssistant({
      supabaseUrl: c.SUPABASE_URL,
      supabaseAnonKey: c.SUPABASE_ANON_KEY,
      anonId: anon,
      intentHeadUrl: './js/ai/intent_head.json',
      linkBaseUrl: 'https://snadk.codeysaa.com',
    });

    const out = document.getElementById('out');
    const meta = document.getElementById('meta');

    async function ask(text) {
      if (!text.trim()) return;
      out.textContent = '…';
      const t0 = performance.now();
      try {
        const r = await bot.ask(text);
        meta.textContent = `intent=${r.intent} conf=${(r.confidence || 0).toFixed(2)} `
          + `outcome=${r.outcome}${r.multiStep ? ' multiStep' : ''}${r.followUp ? ' followUp' : ''} `
          + `${Math.round(performance.now() - t0)}ms`;
        out.innerHTML = renderMarkdown(r.reply);
      } catch (e) {
        meta.textContent = 'error';
        out.textContent = String(e);
      }
    }

    document.getElementById('go').onclick = () => ask(document.getElementById('q').value);
    document.getElementById('warm').onclick = () => { meta.textContent = 'تحميل النموذج…'; bot.warmUp().then(() => meta.textContent = 'جاهز'); };
    document.querySelectorAll('.chips button').forEach((b) => {
      b.onclick = () => { document.getElementById('q').value = b.dataset.q; ask(b.dataset.q); };
    });
  </script>
</body>
</html>
